# docker-compose.yml para desarrollo local
# Se conecta a AuraDB (Neo4j en la nube)
# Solo levanta: API FastAPI

version: "3.9"

services:
  # API FastAPI
  api:
    build: .
    container_name: critical-graph-rag-api
    environment:
      # Google API - REQUERIDO
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # AuraDB (Neo4j en la nube) - reemplazar con tus credenciales
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Servidor
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      # Para hot reload durante desarrollo
      - ./src:/app/src
      - ./config:/app/config
      - ./server.py:/app/server.py
    networks:
      - critical-graph-rag
    command: python server.py

networks:
  critical-graph-rag:
    driver: bridge

# Instrucciones:
# 1. Obtener credenciales de AuraDB:
#    - NEO4J_URI: neo4j+s://xxxx.databases.neo4j.io
#    - NEO4J_USER: neo4j
#    - NEO4J_PASSWORD: <tu_password>
# 2. Crear .env con las credenciales (GOOGLE_API_KEY + NEO4J_*)
# 3. docker-compose up
# 4. API en http://localhost:8000
