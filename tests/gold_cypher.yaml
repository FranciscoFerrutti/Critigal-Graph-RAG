# Queries Cypher oráculo para el conjunto de evaluación del notebook
# `notebooks/04_evaluacion_kpis.ipynb`. Cada entrada produce el `expected`
# de una pregunta factual en `tests/eval_set.yaml`. NO usa LLM —
# se corre offline una vez contra Neo4j y el resultado se pega al `expected`.
#
# Convención:
#   id              slug; coincide con gold_query_id en tests/eval_set.yaml
#   description     qué calcula la query
#   cypher          Cypher literal (sin parámetros — gold es determinístico)
#   answer_format   cómo derivar la respuesta canónica del result-set
#
# Notas sobre el schema:
#   - country = 'Israel' (único valor cargado).
#   - admin1 ∈ {HaDarom, HaMerkaz, HaZafon, Haifa, Jerusalem, Tel Aviv}.
#   - OF_TYPE apunta al sub_event_type (leaf); event_type primario via SUBTYPE_OF.

queries:

  - id: "g01_count_events_israel_oct2023"
    description: "Eventos en Israel durante octubre de 2023."
    cypher: |
      MATCH (e:Event)-[:IN_MONTH]->(:Month {month_id: '2023-10'})
      MATCH (e)-[:AT_LOCATION]->(l:Location)
      WHERE l.country = 'Israel'
      RETURN count(DISTINCT e) AS event_count
    answer_format: "scalar(event_count)"

  - id: "g04_events_telaviv_2023"
    description: "Eventos en distrito Tel Aviv durante 2023."
    cypher: |
      MATCH (e:Event)-[:AT_LOCATION]->(l:Location)
      WHERE l.admin1 = 'Tel Aviv' AND e.year = 2023
      RETURN count(DISTINCT e) AS event_count
    answer_format: "scalar(event_count)"

  - id: "g05_fatalities_israel_2023"
    description: "Suma total de fatalidades en Israel durante 2023."
    cypher: |
      MATCH (e:Event)-[:AT_LOCATION]->(l:Location)
      WHERE l.country = 'Israel' AND e.year = 2023
      RETURN coalesce(sum(e.fatalities), 0) AS total_fatalities
    answer_format: "scalar(total_fatalities)"

  - id: "g19_zero_fatalities_israel_2023"
    description: "Eventos en Israel durante 2023 con cero fatalidades (incluye fatalities NULL)."
    cypher: |
      MATCH (e:Event)-[:AT_LOCATION]->(l:Location)
      WHERE l.country = 'Israel' AND e.year = 2023
        AND coalesce(e.fatalities, 0) = 0
      RETURN count(DISTINCT e) AS event_count
    answer_format: "scalar(event_count)"

  - id: "g20_distinct_event_days_israel_2023"
    description: "Cantidad de días distintos en 2023 con al menos un evento en Israel."
    cypher: |
      MATCH (e:Event)-[:AT_LOCATION]->(l:Location)
      WHERE l.country = 'Israel' AND e.year = 2023
      RETURN count(DISTINCT e.event_date) AS n
    answer_format: "scalar(n)"

  - id: "g21_distinct_actors_telaviv_2023"
    description: "Actores únicos involucrados en eventos en distrito Tel Aviv durante 2023."
    cypher: |
      MATCH (a:Actor)-[:INVOLVED_IN]->(e:Event)-[:AT_LOCATION]->(l:Location)
      WHERE l.admin1 = 'Tel Aviv' AND e.year = 2023
      RETURN count(DISTINCT a) AS n
    answer_format: "scalar(n)"
